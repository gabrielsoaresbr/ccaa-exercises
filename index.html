<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Exercícios de Inglês</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal:#1B8C89; --teal-light:#E6F7F6; --teal-mid:#B2E4E2;
    --orange:#FF8C42; --bg:#F7FBFB; --card:#FFFFFF; --text:#1A2E2E;
    --muted:#6B8F8E; --line:#C5E0DF; --radius:18px;
    --shadow:0 4px 20px rgba(27,140,137,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:'Nunito Sans',sans-serif;color:var(--text);min-height:100vh;padding-bottom:56px}

  /* ── hero ── */
  .hero{background:linear-gradient(135deg,var(--teal) 0%,#0f6361 100%);padding:36px 24px 28px;text-align:center;position:relative;overflow:hidden}
  .hero::before{content:'📚';position:absolute;font-size:130px;opacity:.07;right:-10px;top:-15px;pointer-events:none}
  .hero-eyebrow{font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--teal-mid);margin-bottom:8px}
  .hero-title{font-family:'Nunito',sans-serif;font-size:clamp(24px,7vw,34px);font-weight:900;color:#fff;line-height:1.15;margin-bottom:6px}
  .hero-sub{font-size:14px;color:var(--teal-mid);font-weight:600;margin-bottom:14px}
/* ── content wrapper ── */
  .content{padding:0 16px;max-width:620px;margin:0 auto}

  /* ── loading / empty ── */
  .status{padding:52px 24px;text-align:center;font-family:'Nunito',sans-serif;font-weight:700;font-size:16px;color:var(--muted)}
  .spinner{display:block;width:30px;height:30px;border:3px solid var(--teal-mid);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status a{color:var(--teal);text-decoration:none;font-weight:800}
  .status a:hover{text-decoration:underline}

  /* ── week card ── */
  .week-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:20px;overflow:hidden}

  .week-head{background:var(--teal-light);padding:14px 18px 13px;border-bottom:1.5px solid var(--teal-mid)}
  .week-label{font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .week-theme{font-family:'Nunito',sans-serif;font-size:clamp(17px,4.5vw,21px);font-weight:900;color:var(--text);display:flex;align-items:center;gap:8px;line-height:1.2}
  .week-theme-pt{font-size:13px;color:var(--muted);font-weight:600;margin-top:3px;padding-left:2px}

  /* ── day buttons ── */
  .days-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 16px}

  .day-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px;border-radius:12px;text-decoration:none;transition:background .15s,transform .1s;min-height:54px}
  .day-abbr{font-family:'Nunito',sans-serif;font-weight:900;font-size:14px}
  .day-num{font-size:10px;font-weight:700;opacity:.8}

  .day-btn.available{background:var(--teal);color:#fff;box-shadow:0 2px 8px rgba(27,140,137,.25)}
  .day-btn.available:hover{background:#156a68;transform:translateY(-2px);box-shadow:0 4px 12px rgba(27,140,137,.30)}
  .day-btn.available:active{transform:scale(.95)}

  .day-btn.locked{background:var(--bg);color:var(--line);border:1.5px dashed var(--line);cursor:default;pointer-events:none}
  .day-btn.locked .day-abbr{color:var(--muted);opacity:.5}
  .day-btn.locked .day-num{opacity:.4}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-eyebrow">CCAA</div>
  <div class="hero-title">📖 Exercícios de Inglês</div>
  <div class="hero-sub">Escolha a semana e o dia</div>
</div>

<div class="content">
  <div id="status" class="status"><span class="spinner"></span>Carregando semanas…</div>
  <div id="cards"></div>
</div>

<script>
var ABBR = ['Seg','Ter','Qua','Qui','Sex'];

async function init() {
  var weeks = await loadWeeks();
  var status = document.getElementById('status');
  var cards  = document.getElementById('cards');

  if (!weeks.length) {
    status.innerHTML = 'Nenhuma semana encontrada em <code>data/</code>.';
    return;
  }

  status.style.display = 'none';
  weeks.forEach(function (week) { cards.appendChild(buildCard(week)); });
}

async function loadWeeks() {
  var weeks = [];
  for (var w = 1; w <= 99; w++) {
    var semana = String(w).padStart(2, '0');
    try {
      var r = await fetch('data/semana' + semana + '.json');
      if (!r.ok) break;
      weeks.push(await r.json());
    } catch (e) { break; }
  }
  return weeks;
}

function buildCard(week) {
  var semana = String(week.week).padStart(2, '0');
  var emoji  = week.themeEmoji || '🌟';

  var daysHtml = (week.days || []).map(function (day, i) {
    var abbr = ABBR[i] || ('D' + day.day);
    if (day.generated) {
      return '<a class="day-btn available"'
        + ' href="student.html?semana=' + semana + '&dia=' + day.day + '"'
        + ' title="' + esc(day.weekday) + '">'
        + '<span class="day-abbr">' + abbr + '</span>'
        + '<span class="day-num">Dia ' + day.day + '</span>'
        + '</a>';
    }
    return '<span class="day-btn locked" title="' + esc(day.weekday) + ' — em breve">'
      + '<span class="day-abbr">' + abbr + '</span>'
      + '<span class="day-num">·</span>'
      + '</span>';
  }).join('');

  var card = document.createElement('div');
  card.className = 'week-card';
  card.innerHTML = '<div class="week-head">'
    + '<div class="week-label">Semana ' + semana + '</div>'
    + '<div class="week-theme">' + emoji + ' <span>' + esc(week.theme || '') + '</span></div>'
    + (week.themePt ? '<div class="week-theme-pt">' + esc(week.themePt) + '</div>' : '')
    + '</div>'
    + '<div class="days-grid">' + daysHtml + '</div>';
  return card;
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
</body>
</html>
